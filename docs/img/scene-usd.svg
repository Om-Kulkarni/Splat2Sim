<path d="M400,240 V265 H600 V288" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="640" y="70" width="320" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
