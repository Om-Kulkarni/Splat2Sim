<text x="350.0" y="209.55" text-anchor="middle" font-size="11" fill="#334155">Xform, T_base_recon</text>
<text x="350.0" y="226.55" text-anchor="middle" font-size="11" fill="#334155">r2s:anchor = "charuco" | "fallback", r2s:anchor_* residuals</text>
