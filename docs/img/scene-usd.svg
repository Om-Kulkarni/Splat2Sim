<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Scene USD layer structure"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="0.5" y="0.5" width="999" height="519" rx="12" fill="#ffffff" stroke="#d0d7de"/>
