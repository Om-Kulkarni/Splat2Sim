<text x="600.0" y="369.55" text-anchor="middle" font-size="11" fill="#334155">Mesh + CollisionAPI + MeshCollisionAPI</text>
<text x="600.0" y="386.55" text-anchor="middle" font-size="11" fill="#334155">TableBox, PedestalBox (Cube + colliders)</text>
<text x="600.0" y="403.55" text-anchor="middle" font-size="11" fill="#334155">all visibility = invisible, static</text>
