[project]
name = "splat2sim"
version = "0.1.0"
license = "MIT"
description = "Splat2Sim: handheld OAK-D Pro W (or D455) Capture -> Isaac Sim 6.1 Scene + Task environment"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
r2s = "splat2sim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["splat2sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
